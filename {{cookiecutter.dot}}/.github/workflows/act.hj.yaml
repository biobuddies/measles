concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
    run:
        shell: bash --noprofile --norc -o errexit -o nounset -o pipefail -o xtrace {0}
#% set env = github_actions_env or 'env:\n' %#
#% if 'terraform' in cookiecutter.languages.lower().split(',') %#
#% if 'TENV_GITHUB_TOKEN' not in env %#
#% set env = env.rstrip('\n') + '\n    TENV_GITHUB_TOKEN: ${{ github.token }}\n' %#
#% endif %#
#% if 'TF_INPUT' not in env %#
#% set env = env.rstrip('\n') + "\n    TF_INPUT: 'false'\n" %#
#% endif %#
#% endif %#
#{ '\n' + env if env != 'env:\n' else '' }#
name: act

permissions:
    contents: read

jobs:
    # Root jobs
    check:
        permissions:
            actions: write
            contents: write
        outputs:
            committed: ${{ steps.generate.outputs.committed }}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  ref: ${{ github.event.pull_request.head.sha || github.sha }}
                  submodules: true
            - uses: jdx/mise-action@v4
              with:
                  experimental: true
                  log_level: error
            - run: mise set-environment
            - name: Check and commit generated changes
              id: generate
              env:
                  AUTO_COMMIT: ${{ github.event_name == 'pull_request'
                      && github.event.pull_request.head.repo.full_name == github.repository
                      && github.head_ref != github.event.repository.default_branch }}
              run: |
                  if [[ "$AUTO_COMMIT" != true ]]; then
                      mise pre-commit-all
                      exit
                  fi

                  status=0
                  mise pre-commit-all || status=$?
                  if git diff --quiet HEAD --; then
                      exit "$status"
                  fi

                  git add --update
                  git -c user.name='github-actions[bot]' \
                      -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                      commit -m Autoformat
                  GIHA=$(env -u GIHA mise giha)
                  TABR=$(env -u TABR mise tabr)
                  export GIHA TABR
                  mise pre-commit-all
                  git diff --exit-code HEAD --
                  echo 'committed=true' >> "$GITHUB_OUTPUT"
            - name: Push and rerun on the generated commit
              if: steps.generate.outputs.committed == 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
                  ORIGINAL_HEAD: ${{ github.event.pull_request.head.sha }}
              run: |
                  branch="refs/heads/$GITHUB_HEAD_REF"
                  git push --force-with-lease="$branch:$ORIGINAL_HEAD" origin "HEAD:$branch"
                  # PR runs from GITHUB_TOKEN pushes require approval.
                  gh workflow run act.yaml --ref "$GITHUB_HEAD_REF"
    tabularize:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  ref: ${{ github.event.pull_request.head.sha || github.sha }}
                  submodules: true
            - uses: jdx/mise-action@v4
              with:
                  experimental: true
                  log_level: error
                  install: false
            - run: mise set-environment
            - run: mise tabularize
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  ref: ${{ github.event.pull_request.head.sha || github.sha }}
                  submodules: true
            - uses: jdx/mise-action@v4
              with:
                  experimental: true
                  log_level: error
            - run: mise set-environment
            - run: mise checkout
            - run: mise test

    # Leaf jobs
    build-deploy:
        needs: [check, test]
        if: needs.check.outputs.committed != 'true'
        permissions:
            contents: write
            #% if 'terraform' in cookiecutter.languages.lower().split(',') %#
            pull-requests: write
            #% endif %#
            #% if cookiecutter.publish_to_pypi %#
            id-token: write
            #% endif %#
        runs-on: ubuntu-latest
        environment:
            name: ${{ github.head_ref || github.ref_name }}
            #% if cookiecutter.domain_name %#
            #% set parts = cookiecutter.domain_name.split('.', 1) %#
            # Synchronize with .config/mise.toml:50 tasks.fqdn.
            url: >-
                https://${{ github.ref_name == 'main'
                && '#{ cookiecutter.domain_name }#'
                #% if parts | length > 1 and '.' in parts[1].split('/')[0] %#
                || format('{0}-{1}.#{ parts[1] }#', '#{ parts[0] }#',
                github.head_ref || github.ref_name) }}
                #% else %#
                || format('{0}.#{ cookiecutter.domain_name }#',
                github.head_ref || github.ref_name) }}
                #% endif %#
            #% endif %#
        steps:
            - uses: actions/checkout@v7
              with:
                  submodules: true
            - uses: jdx/mise-action@v4
              with:
                  experimental: true
                  log_level: error
            - run: mise set-environment
            - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  mise release
                  tabr=$(env -u TABR mise tabr)
                  echo "TABR=$tabr" >> "$GITHUB_ENV"
            - run: mise build
            - env:
                  ENVI: ${{ github.head_ref || github.ref_name }}
              run: mise deploy "$ENVI"
            - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              run: |
                  expected=$(git ls-remote --refs origin refs/heads/prod | cut -f 1)
                  git push "--force-with-lease=refs/heads/prod:$expected" origin HEAD:prod

on: # yamllint disable-line rule:truthy
    pull_request:
    push:
        branches:
            #% if branch_trigger %#
            -  #{ TABR }# # Until main has this workflow
            #% endif %#
            - main
    workflow_dispatch:

run-name: Acting on behalf of ${{ github.actor }}
