{% raw -%}
concurrency:
    group: ${{ github.workflow }}-${{ github.event_name == 'push' && 'main' || github.ref }}
    cancel-in-progress: ${{ github.event_name != 'push' }}

{% endraw -%}
defaults:
    run:
        shell: bash --noprofile --norc -o errexit -o nounset -o pipefail -o xtrace {0}
{%- set env = github_actions_env or 'env:\n' %}
{%- if 'terraform' in cookiecutter.languages.lower().split(',') %}
    {%- if 'TENV_GITHUB_TOKEN' not in env %}
        {%- set env = env.rstrip('\n') + '\n    TENV_GITHUB_TOKEN: ${{ github.token }}\n' %}
    {%- endif %}
    {%- if 'TF_INPUT' not in env %}
        {%- set env = env.rstrip('\n') + "\n    TF_INPUT: 'false'\n" %}
    {%- endif %}
{%- endif %}
{{ '\n' + env if env != 'env:\n' else '' }}
name: act

{% raw -%}
permissions:
    contents: read

jobs:
    # Root jobs
    check:
        runs-on: ubuntu-latest
        steps:
            # Real hash is head_ref on pull_request, ref on push
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  ref: ${{ github.head_ref || github.ref }}
            - uses: jdx/mise-action@v4
              with:
                  experimental: true
            - run: mise set-environment
            - run: mise pre-commit-all
    tabularize:
        runs-on: ubuntu-latest
        steps:
            # Real hash is head_ref on pull_request, ref on push
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  ref: ${{ github.head_ref || github.ref }}
            - uses: jdx/mise-action@v4
              with:
                  experimental: true
                  install: false
            - run: mise tabularize
    test:
        runs-on: ubuntu-latest
        steps:
            # Real hash is head_ref on pull_request, ref on push
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  ref: ${{ github.head_ref || github.ref }}
            - uses: jdx/mise-action@v4
              with:
                  experimental: true
            {%- endraw %}
            - run: |
                  # shellcheck disable=SC2086
                  mkdir -p $HOME/code
                  # shellcheck disable=SC2086
                  ln -s ../work/{{ CONA }}/{{ CONA }} $HOME/code/{{ CONA }}
{% for repository, branch in cookiecutter.peer_checkouts.items()|sort %}
                  # shellcheck disable=SC2086
                  git clone --branch {{ branch }} \
                      https://github.com/{{ repository }}.git \
                      $HOME/code/{{ repository.split('/')[-1] }}
                  {%- endfor %}
            {%- raw %}
            - run: mise test

    # Leaf jobs
    build-deploy:
        needs: [check, test]
        permissions:
            contents: write
        {%- endraw -%}
        {%- if cookiecutter.publish_to_pypi %}
            id-token: write
        {%- endif -%}
        {% raw %}
        runs-on: ubuntu-latest
        environment:
            name: ${{ github.head_ref || github.ref_name }}
        {%- endraw -%}
        {%- if cookiecutter.domain_name %}
        {%- set parts = cookiecutter.domain_name.split('.', 1) %}
            # Synchronize with .config/mise.toml:50 tasks.fqdn.
            url: >-
                https://{{ '${{' }} github.ref_name == 'main'
                && '{{ cookiecutter.domain_name }}'
        {%- if parts | length > 1 and '.' in parts[1].split('/')[0] %}
                || format('{0}-{1}.{{ parts[1] }}', '{{ parts[0] }}',
                github.head_ref || github.ref_name) {{ '}}' }}
        {%- else %}
                || format('{0}.{{ cookiecutter.domain_name }}',
                github.head_ref || github.ref_name) {{ '}}' }}
        {%- endif %}
        {%- endif -%}
        {% raw %}
        steps:
            - uses: actions/checkout@v7
            - uses: jdx/mise-action@v4
              with:
                  experimental: true
            - run: mise set-environment
            {%- endraw -%}
            {%- if cookiecutter.publish_to_pypi %}
            - if: github.event_name == 'push'
              run: mise release
            - run: mise build
            - if: github.event_name == 'push'
              uses: pypa/gh-action-pypi-publish@release/v1
            {%- else %}
            - run: mise build
            - run: mise deploy "{{ '${{' }} github.head_ref || github.ref_name {{ '}}' }}"
            {%- endif %}
            {%- raw %}
            - if: github.event_name == 'push'
              run: |
                  expected=$(git ls-remote --refs origin refs/heads/prod | cut -f 1)
                  git push "--force-with-lease=refs/heads/prod:$expected" origin HEAD:prod

on: # yamllint disable-line rule:truthy
    pull_request:
    push:
        branches:
            - main
    workflow_dispatch:

run-name: Acting on behalf of ${{ github.actor }}
{% endraw -%}
