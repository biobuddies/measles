{% if cookiecutter.publish_to_pypi -%}
[build-system]
backend-path = ['']
build-backend = 'pypi_compatible_build'
requires = ['setuptools']

{% endif -%}
[project]
name = '{{ CONA }}'
description = '{{ cookiecutter.description }}'
readme = 'README.md'
requires-python = '>={{ cookiecutter.python_version }}'
version = '0'

dependencies = [
    {% for dependency in python_dependencies|sort %}
    '{{ dependency }}',
    {% endfor %}
]

[project.optional-dependencies]
{% set base = {
    'pre-commit': [
        'actionlint-py',
        'basedpyright',
        'cookiecutter',
        'django-upgrade',
        'djlint',
        'hadolint-py @ git+https://github.com/AleksaC/hadolint-py.git',
        'pre-commit-hooks',
        'pyrefly',
        'ruff',
        'shellcheck-py',
        'shfmt-py',
        'typos',
        'validate-pyproject[all]',
        'yamllint',
    ],
    'test': python_test_dependencies,
} -%}
{% if cookiecutter.publish_to_pypi -%}
{% set _ = base.update({'build': ['setuptools']}) -%}
{% endif -%}
{% set groups = dict(python_optional_dependencies) -%}
{% for group, dependencies in base.items() -%}
{% set _ = groups.update({group: (dependencies + groups.get(group, []))|sort}) -%}
{% endfor -%}
{% for group, dependencies in groups.items()|sort -%}
{{ group }} = [
{{ "    '" ~ (dependencies|join("',\n    '")) ~ "'," if dependencies else '' }}
]
{% endfor %}
[tool.pytest.ini_options]
{{ "DJANGO_SETTINGS_MODULE = 'config.settings'\n" if has_django else '' -}}
norecursedirs = ['.venv', 'node_modules', '{{ '{{cookiecutter.dot}}' }}']

{% if cookiecutter.publish_to_pypi -%}
[tool.setuptools]
py-modules = ['{{ CONA|replace('-', '_') }}']

{% endif -%}
[tool.basedpyright]
extends = '.biobuddies/basedpyright.toml'

[tool.ruff]
extend = '.biobuddies/ruff.toml'

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
