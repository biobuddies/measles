[build-system]
backend-path = ['']
build-backend = 'pypi_compatible_build'
requires = ['setuptools>=77', 'setuptools_scm']

[project]
description = 'Continuous cookiecutter featuring mise'
name = 'measles'
readme = 'README.md'
requires-python = '>=3.12'
dynamic = ['version']

dependencies = [
    
]

[project.optional-dependencies]
build = [
    'setuptools',
]
pre-commit = [
    'actionlint-py',
    'basedpyright',
    'cookiecutter',
    'django-upgrade',
    'djlint>=1.45.0',
    'hadolint-py @ git+https://github.com/AleksaC/hadolint-py.git',
    'pre-commit-hooks',
    'pyrefly',
    'ruff',
    'shellcheck-py',
    'shfmt-py',
    'styleforce',
    'typos',
    'validate-pyproject[all]',
    'yamllint',
]
test = [
    'django',
    'helicopyter',
    'pytest',
    'pytest-cov',
    'pytest-httpserver',
]

[project.urls]
source = 'https://github.com/biobuddies/measles'

[tool.coverage.run]
source_pkgs = ['measles']

[tool.pytest.ini_options]
norecursedirs = ['.venv', 'node_modules', '{{cookiecutter.dot}}']

[tool.setuptools]
py-modules = ['measles']

[tool.setuptools_scm]
# Skip provider release tags like terraform-provider-cloudflare-v5.27.0-startup.1
git_describe_command = "git describe --dirty --tags --long --match 'v*'"

[tool.basedpyright]
extends = '.biobuddies/basedpyright.toml'

[tool.djlint]
close_void_tags = true
format_attribute_template_tags = true
indent = 4
max_attribute_length = 100
max_blank_lines = 1
max_line_length = 100
quote_style = 'single'

[tool.ruff]
line-length = 100
target-version = 'py312'

[tool.ruff.format]
docstring-code-format = true
preview = true
quote-style = 'single'
skip-magic-trailing-comma = true

[tool.ruff.lint]
external = ['typos']
fixable = ['ALL']
ignore = [
    'ANN401', # `**kwargs: Any` is reasonable
    'BLE001', # except Exception is okay
    'COM812', # Insists on `join([],)` over `join([])`
    'CPY001', # Git records authors and dates
    'D101',
    'D103',
    'D104',
    'D107',
    'EM101',  # Simple code is more important than simple tracebacks
    'EM102',  # Simple code is more important than simple tracebacks
    'FBT001', # What is bad about Boolean parameters?
    'FIX002', # Don't make the perfect the enemy of the good
    'INP001',
    # Demystify magic values with good variable names, comments, or other context. Follow
    # Rule Of Three for when to abstract.
    'PLR2004',
    'Q000',    # ruff format will single quote
    'Q001',    # ruff format will single quote
    'Q003',    # ruff format will single quote
    # N806 tries to lowercase classes; currently ignored on a line-by-line basis
    'S607',   # Using $PATH is pretty necessary for nvmrc, pyenv, venv, tfenv
    'SLF001', # Private member access is probably a last resort
    'TD002',  # The git log records who wrote a TODO line
    'TD003',  # Don't require issue links
    'TD004',  # A colon takes up space without really improving readability
    'TRY002', # Forces premature specialization; the right time to subclass is when the exception starts being caught
    'TRY003', # Forces premature specialization; the right time to subclass is when the exception starts being caught
    'UP031',  # Percent formatting can simplify curly-heavy strings
]
select = ['ALL']

[tool.ruff.lint.flake8-pytest-style]
parametrize-values-row-type = 'tuple'
parametrize-values-type = 'tuple'

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.lint.per-file-ignores]
# Followup: detect [project.scripts] targets and __main__ guards
'**/{__main__,management/commands/*,manage,scripts/*}.py' = [
    'T201', # Command line interfaces print
]
'**/{conftest,test*}.py' = [
    'ANN201',  # -> None doesn't improve pytest functions
    'N802',    # Test functions can match class names
    'PLR2004', # Tests can have magic values
    'PLR6301', # Test classes can ignore self
    'PT013',   # `import pytest` would be inconsistent with other imports
    'S101',    # Tests can have assertions
    'S105',    # Testing authentication is good
    'S603',    # Tests can call subprocesses
]

[tool.ruff.lint.pydocstyle]
convention = 'pep257'

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
