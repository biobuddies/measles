[build-system]
backend-path = ['']
build-backend = 'pypi_compatible_build'
requires = ['setuptools>=77', 'setuptools_scm']

[project]
description = 'Continuous cookiecutter featuring mise'
name = 'measles'
readme = 'README.md'
requires-python = '>=3.12'
dynamic = ['version']

dependencies = [
    
]

[project.optional-dependencies]
build = [
    'setuptools',
]
pre-commit = [
    'actionlint-py',
    'basedpyright',
    'cookiecutter',
    'django-upgrade',
    'djlint>=1.45.0',
    'hadolint-py @ git+https://github.com/AleksaC/hadolint-py.git',
    'pre-commit-hooks',
    'pyrefly',
    'ruff',
    'shellcheck-py',
    'shfmt-py',
    'styleforce',
    'typos',
    'validate-pyproject[all]',
    'yamllint',
]
test = [
    'django',
    'helicopyter',
    'pytest',
    'pytest-cov',
    'pytest-httpserver',
]

[project.urls]
source = 'https://github.com/biobuddies/measles'

[tool.coverage.run]
source_pkgs = ['measles']

[tool.pytest.ini_options]
norecursedirs = ['.venv', 'node_modules', '{{cookiecutter.dot}}']

[tool.setuptools]
py-modules = ['measles']

[tool.setuptools_scm]
# Skip provider release tags like terraform-provider-cloudflare-v5.27.0-startup.1
git_describe_command = "git describe --dirty --tags --long --match 'v*'"

[tool.basedpyright]
extends = '.biobuddies/basedpyright.toml'

[tool.djlint]
close_void_tags = true
format_attribute_template_tags = true
indent = 4
max_attribute_length = 100
max_blank_lines = 1
max_line_length = 100
quote_style = 'single'

[tool.ruff]
extend = '.biobuddies/ruff.toml'

# Command line interfaces print; anchored at the repository root, unlike patterns in the extended
# file. Followup: detect [project.scripts] targets and __main__ guards
[tool.ruff.lint.extend-per-file-ignores]
'**/{__main__,management/commands/*,manage,scripts/*}.py' = ['T201']

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
