[build-system]
backend-path = ['']
build-backend = 'pypi_compatible_build'
requires = ['setuptools']

[project]
name = 'measles'
readme = 'README.md'
requires-python = '>=3.12'
version = '0'

dependencies = [
    
]

[project.optional-dependencies]
pre-commit = [
    'actionlint-py',
    'basedpyright',
    'cookiecutter',
    'django-upgrade',
    'djlint',
    'hadolint-py @ git+https://github.com/AleksaC/hadolint-py.git',
    'pre-commit-hooks',
    'pyrefly',
    'ruff',
    'shellcheck-py',
    'shfmt-py',
    'typos',
    'validate-pyproject[all]',
    'yamllint',
]
test = [
    'pytest',
    'pytest-cov',
    'pytest-httpserver',
]

[tool.pytest.ini_options]
norecursedirs = ['.venv', 'node_modules', '{{cookiecutter.dot}}']

[tool.setuptools]
py-modules = ['measles']

[tool.basedpyright]
extends = '.biobuddies/basedpyright.toml'

[tool.ruff]
extend = '.biobuddies/ruff.toml'

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
