concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
    run:
        shell: bash --noprofile --norc -o errexit -o nounset -o pipefail -o xtrace {0}

env:
    ALLOWEDFLARE_EMAIL: person@emailprovider.example
    ALLOWEDFLARE_PRIVATE_DOMAIN: organization.example
    CLOUDFLARE_ACCOUNT_ID: 0123456789abcdef0123456789abcdef00
    CLOUDFLARE_ZONE_ID: 0123456789abcdef0123456789abcdef01
    GITHUB_TOKEN: ${{ github.token }}
    PATH: .venv/bin:/home/runner/.local/bin:/home/runner/.local/share/mise/shims:/usr/bin:/bin

name: act

permissions:
    contents: read

jobs:
    # Root jobs
    check:
        runs-on: ubuntu-latest
        steps:
            # Real hash is head_ref on pull_request, ref on push
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  ref: ${{ github.head_ref || github.ref }}
                  submodules: true
            - uses: jdx/mise-action@v4
              with:
                  experimental: true
                  log_level: error
            - run: mise set-environment
            - run: mise pre-commit-all
    tabularize:
        runs-on: ubuntu-latest
        steps:
            # Real hash is head_ref on pull_request, ref on push
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  ref: ${{ github.head_ref || github.ref }}
                  submodules: true
            - uses: jdx/mise-action@v4
              with:
                  experimental: true
                  log_level: error
                  install: false
            - run: mise tabularize
    test:
        runs-on: ubuntu-latest
        steps:
            # Real hash is head_ref on pull_request, ref on push
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  ref: ${{ github.head_ref || github.ref }}
                  submodules: true
            - uses: jdx/mise-action@v4
              with:
                  experimental: true
                  log_level: error
            - run: mise checkout
            - run: mise test

    # Leaf jobs
    build-deploy:
        needs: [check, test]
        permissions:
            contents: write
            id-token: write
        runs-on: ubuntu-latest
        environment:
            name: ${{ github.head_ref || github.ref_name }}
        steps:
            - uses: actions/checkout@v7
              with:
                  submodules: true
            - uses: jdx/mise-action@v4
              with:
                  experimental: true
                  log_level: error
            # TABR is the branch, so FQDN is the preview or production domain
            - run: mise set-environment
            - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: mise release
            # HEAD is tagged: TABR is now the tag
            - run: mise build
            - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              uses: pypa/gh-action-pypi-publish@release/v1
            - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              run: |
                  expected=$(git ls-remote --refs origin refs/heads/prod | cut -f 1)
                  git push "--force-with-lease=refs/heads/prod:$expected" origin HEAD:prod

on: # yamllint disable-line rule:truthy
    pull_request:
    push:
        branches:
            - main
    workflow_dispatch:

run-name: Acting on behalf of ${{ github.actor }}
